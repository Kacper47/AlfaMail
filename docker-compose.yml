services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/alfa_mail.db
      # Required: compose refuses to start without it (see README).
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY first - see the Getting Started section of the README}
    volumes:
      - db_data:/app/data
    # No published ports: the backend is reachable only through the proxy.

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS material, generated by scripts/generate-certs.sh (not in git)
      - ./nginx.crt:/etc/nginx/conf.d/nginx.crt:ro
      - ./nginx.key:/etc/nginx/conf.d/nginx.key:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  db_data:
