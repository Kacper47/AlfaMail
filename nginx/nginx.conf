# Request-rate limits per client IP. 429 is returned when exceeded.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;   # register / login / 2FA
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;   # everything else
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Automatic redirect to a secure protocol
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/conf.d/nginx.crt;
    ssl_certificate_key /etc/nginx/conf.d/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Encrypted messages with attachments are well below this (see MAX_CIPHERTEXT_CHARS).
    client_max_body_size 8m;

    # --- Security headers (also sent on error responses) ---
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # No 'unsafe-inline' / 'unsafe-eval' and no third-party origins: every script and
    # stylesheet is a same-origin file.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # Proxy headers (the backend trusts X-Real-IP only because nginx overwrites it)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- FRONTEND: static files ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # --- BACKEND: only the endpoints that exist are proxied ---
    location = /register         { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend:8000; }
    location = /login            { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend:8000; }
    location = /login/verify-2fa { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend:8000; }
    location = /2fa/enable       { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend:8000; }

    location = /keys/me          { limit_req zone=api burst=30 nodelay; proxy_pass http://backend:8000; }
    location /users/             { limit_req zone=api burst=30 nodelay; proxy_pass http://backend:8000; }
    location /messages           { limit_req zone=api burst=30 nodelay; proxy_pass http://backend:8000; }
    location = /account/activity { limit_req zone=api burst=30 nodelay; proxy_pass http://backend:8000; }
}
