<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AlfaMail - Inbox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="row">
    <h1>Secure inbox</h1>
    <div><strong id="whoami"></strong> <button type="button" id="logout-btn">Log out</button></div>
  </div>

  <section class="card" aria-labelledby="compose-h">
    <h2 id="compose-h">New message</h2>
    <form id="compose-form">
      <label for="recipients">To (usernames, separated by commas or spaces; max 10)</label>
      <input type="text" id="recipients" autocomplete="off" required>
      <label for="body">Message</label>
      <textarea id="body" rows="5" maxlength="20000" required></textarea>
      <label for="files">Attachments (max 5 files, 2 MB each, 3 MB total)</label>
      <input type="file" id="files" multiple>
      <button type="submit" class="primary" id="send-btn">Encrypt and send</button>
      <span id="send-status" class="status" role="status"></span>
    </form>
  </section>

  <section aria-labelledby="inbox-h">
    <div class="row">
      <h2 id="inbox-h">My messages</h2>
      <button type="button" id="refresh-btn">Refresh</button>
    </div>
    <p id="inbox-status" class="status" role="status"></p>
    <div id="inbox"></div>
  </section>

  <section class="card" aria-labelledby="activity-h">
    <h2 id="activity-h">Recent account activity</h2>
    <p class="muted">Sign-ins and failed attempts on your account. If you see an IP address you do not recognise, someone else may know your password.</p>
    <table class="activity"><tbody id="activity"></tbody></table>
  </section>
</main>
<script type="module" src="js/inbox.js"></script>
</body>
</html>
