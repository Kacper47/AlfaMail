<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AlfaMail - Sign in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="narrow">
  <div class="card">
    <h1>AlfaMail</h1>

    <form id="login-form" autocomplete="on">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" maxlength="32" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" maxlength="256" required>
      <button type="submit" class="primary" id="login-btn">Next</button>
      <p class="muted">No account? <a href="register.html">Register here</a></p>
    </form>

    <form id="twofa-form" hidden>
      <h2>Two-factor authentication</h2>
      <p class="muted">Enter the 6-digit code from your authenticator app.</p>
      <label for="twofa-code">Code</label>
      <input type="text" id="twofa-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <button type="submit" class="primary" id="twofa-btn">Verify and sign in</button>
    </form>

    <p id="status" class="status" role="status" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>
  </div>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
